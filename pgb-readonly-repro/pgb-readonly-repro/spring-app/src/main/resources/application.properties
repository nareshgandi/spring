spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.demo=INFO

# Through PgBouncer (transaction pooling). RO_MODE = pgJDBC readOnlyMode:
#   always      -> session-level SET on setReadOnly()  => leaks through PgBouncer (the bug)
#   transaction -> BEGIN READ ONLY per transaction     => no leak (the driver-side fix)
spring.datasource.url=jdbc:postgresql://127.0.0.1:${PGB_PORT:6433}/repro?prepareThreshold=0&readOnlyMode=${RO_MODE:always}&ApplicationName=spring-repro
spring.datasource.username=repro
spring.datasource.password=repro

# HikariCP, like the customer's app
spring.datasource.hikari.pool-name=spring-repro
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true

repro.seconds=20
repro.writers=4
repro.readers=2
