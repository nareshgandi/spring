; Template - run.sh fills @DB_PORT@/@PGB_PORT@ and applies the FIX into /tmp/pgb-repro/pgbouncer.ini
[databases]
repro = host=127.0.0.1 port=@DB_PORT@ dbname=repro

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = @PGB_PORT@
unix_socket_dir = /tmp/pgb-repro
auth_type = scram-sha-256
auth_file = /tmp/pgb-repro/userlist.txt
admin_users = repro
logfile = /tmp/pgb-repro/pgbouncer.log
pidfile = /tmp/pgb-repro/pgbouncer.pid

; Customer-like setup: transaction pooling, few server connections so they get shared
pool_mode = transaction
default_pool_size = 3
max_client_conn = 100
; pgjdbc sends extra_float_digits in the startup packet; PgBouncer rejects unknown startup params
ignore_startup_parameters = extra_float_digits
server_reset_query = DISCARD ALL
server_reset_query_always = 0

; FIX=track appends: track_extra_parameters = default_transaction_read_only
; FIX=reset changes: server_reset_query = RESET default_transaction_read_only
;                    server_reset_query_always = 1
